<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NIDO">

<style>[hidden]{display:none!important}html,body{margin:0}:root{padding:0}</style></head><body><title>NIDO</title>
<meta name="theme-color" content="#0e0b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* NIDO UI — la criatura es el centro; la interfaz flota en los bordes.
   Una superficie por capa: dentro de una hoja se ordena con tipo, espacio y líneas finas, nunca con cajas dentro de cajas.
   Cada necesidad tiene su color fijo (icono, medidor, botón y burbuja). El acento --pet toma el color de la criatura. */
:root {
  --bg: #0e0b1f; --surface: #191433; --surface2: #241d45; --glass: rgba(18, 14, 40, .64);
  --ink: #f7f4ff; --ink2: rgba(247, 244, 255, .7); --ink3: rgba(247, 244, 255, .44); --hair: rgba(255, 255, 255, .1);
  --pet: #ffb23f; --food: #ff9f43; --joy: #ff5c8a; --disc: #7aa7ff; --weight: #c9c1e8; --care: #5ef2b1; --clean: #4fd2ff; --light: #ffd84a; --star: #ffc83d; --bad: #ff6b8a;
  --shell: #ff8fb8; --shell2: #d9467e; --lcd: #b9c7a2; --lcdink: #1b2414;
  --r1: 12px; --r2: 20px; --r3: 28px;
  --display: 'Gabarito', 'Avenir Next Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Figtree', 'Avenir Next', system-ui, -apple-system, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: max(16px, env(safe-area-inset-left, 0px)); --sar: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--pet); outline-offset: 3px; }
svg { display: block; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- HUD moderno ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
#hud > * { pointer-events: auto; }
.hudTop { padding: calc(var(--sat) + 12px) var(--sar) 26px var(--sal); background: linear-gradient(rgba(10, 8, 26, .55), rgba(10, 8, 26, 0)); }
.idrow { display: flex; align-items: center; gap: 10px; }
.who { flex: 1; min-width: 0; }
.who h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; text-shadow: 0 2px 16px rgba(0, 0, 0, .35); }
.gen { font-family: var(--display); font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--bg); background: var(--pet); padding: 4px 7px 3px; border-radius: 7px; }
.who p { margin: 6px 0 0; font-size: 13.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
.stars { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 11px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-family: var(--display); font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.stars svg { width: 18px; height: 18px; fill: var(--star); }
.iconbtn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); flex: none; }
.needs { display: flex; gap: 14px; margin-top: 16px; flex-wrap: wrap; row-gap: 10px; }
.need { display: flex; align-items: center; gap: 7px; }
.need svg { width: 18px; height: 18px; }
.pips { display: flex; gap: 3px; }
.pips i { width: 10px; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .18); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.pips i.on { background: currentColor; }
.need.low .pips i:first-child { animation: blink 1s infinite; background: var(--bad); }
@keyframes blink { 50% { opacity: .25; } }
.need .num { font-family: var(--display); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink); text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
.next { margin-top: 10px; font-size: 12.5px; color: var(--ink2); display: flex; gap: 6px; align-items: center; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); }
.next svg { width: 14px; height: 14px; }

.hudBot { padding: 26px var(--sar) calc(var(--sab) + 12px) var(--sal); background: linear-gradient(rgba(10, 8, 26, 0), rgba(10, 8, 26, .5)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.prompt { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 22px; background: var(--ink); color: #1a1430; font-weight: 700; font-size: 14.5px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); max-width: 100%; }
.prompt .dot { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; color: #1a1430; flex: none; }
.prompt .dot svg { width: 17px; height: 17px; }
.prompt b { font-weight: 800; }
.prompt span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
.dock { width: 100%; max-width: 600px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 8px 6px 6px; border-radius: var(--r3); background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
.act { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--ink2); min-width: 0; padding-bottom: 2px; }
.act .orb { width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; background: rgba(255, 255, 255, .07); color: var(--c); transition: transform .12s, background .2s; position: relative; }
.act .orb svg { width: 23px; height: 23px; }
.act:active .orb { transform: scale(.9); }
.act.hot { color: var(--ink); }
.act.hot .orb { background: var(--c); color: #1a1430; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); }
.act[disabled] { opacity: .32; }

/* ---------- Clásico ---------- */
#classic { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(120% 80% at 50% 30%, #2a2140 0%, #120e22 60%, #0a0815 100%); padding: calc(var(--sat) + 12px) var(--sar) calc(var(--sab) + 12px) var(--sal); }
.ctop { position: absolute; top: calc(var(--sat) + 12px); left: var(--sal); right: var(--sar); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ctop .tag { font-family: var(--display); font-weight: 900; letter-spacing: .3em; font-size: 13px; color: var(--ink3); flex: 1; }
.chain { width: 38px; height: 46px; border: 7px solid #b9b3c9; border-radius: 50%; margin-bottom: -40px; box-shadow: inset 0 2px 2px rgba(0, 0, 0, .3), 0 2px 3px rgba(0, 0, 0, .4); }
.shell { position: relative; width: min(84vw, 340px, 52vh); aspect-ratio: .84; border-radius: 50% 50% 47% 47% / 56% 56% 44% 44%; background: radial-gradient(70% 55% at 32% 22%, color-mix(in srgb, #fff 55%, var(--shell)) 0%, var(--shell) 38%, var(--shell2) 100%); box-shadow: inset -14px -22px 40px rgba(0, 0, 0, .28), inset 10px 14px 30px rgba(255, 255, 255, .35), 0 30px 60px rgba(0, 0, 0, .55), 0 6px 0 rgba(0, 0, 0, .18); display: flex; flex-direction: column; align-items: center; }
.shell::after { content: ''; position: absolute; left: 14%; top: 7%; width: 30%; height: 16%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .55), transparent); transform: rotate(-24deg); pointer-events: none; }
.brand { margin-top: 15%; font-family: var(--display); font-weight: 900; font-size: clamp(11px, 3.4vw, 14px); letter-spacing: .45em; color: color-mix(in srgb, var(--shell2) 55%, #2b0d1c); opacity: .75; }
.bezel { margin-top: 3%; width: 70%; aspect-ratio: 1.02; border-radius: 22%; padding: 7%; background: radial-gradient(90% 90% at 40% 30%, #fbf3ea, #e5d8cc); box-shadow: inset 0 3px 8px rgba(0, 0, 0, .35), 0 1px 0 rgba(255, 255, 255, .6); position: relative; }
.bezel::before { content: ''; position: absolute; inset: 3.5%; border-radius: 20%; border: 2px dotted color-mix(in srgb, var(--shell2) 70%, transparent); pointer-events: none; }
.lcdwrap { width: 100%; height: 100%; border-radius: 10%; overflow: hidden; background: var(--lcd); box-shadow: inset 0 4px 10px rgba(0, 0, 0, .35); position: relative; }
.lcdwrap::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255, 255, 255, .22), transparent 40%); pointer-events: none; }
#lcd { width: 100%; height: 100%; display: block; }
.btns { position: relative; width: 62%; height: 22%; margin-top: 2%; }
.hb { position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(60% 60% at 35% 30%, #fff6c9, #f0c23b 55%, #b98400); box-shadow: 0 5px 0 #8a6200, 0 7px 12px rgba(0, 0, 0, .35), inset 0 -2px 3px rgba(0, 0, 0, .2); transition: transform .06s, box-shadow .06s; }
.hb:active, .hb.down { transform: translateY(4px); box-shadow: 0 1px 0 #8a6200, 0 2px 4px rgba(0, 0, 0, .35), inset 0 -2px 3px rgba(0, 0, 0, .2); }
.hb span { position: absolute; left: 50%; top: 112%; transform: translateX(-50%); font-family: var(--display); font-weight: 900; font-size: 11px; color: color-mix(in srgb, var(--shell2) 50%, #2b0d1c); opacity: .8; }
.hb.a { left: 4%; top: 6%; } .hb.b { left: 39%; top: 34%; } .hb.c { right: 4%; top: 6%; }
.legend { font-size: 12.5px; color: var(--ink3); text-align: center; line-height: 1.5; max-width: 34ch; }
.legend b { color: var(--ink2); font-weight: 600; }

/* ---------- Hojas: una sola superficie ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(6, 4, 16, .42); }
.scrim.clear { background: transparent; pointer-events: none; }
.scrim.clear .sheet { pointer-events: auto; }
.sheet { width: min(560px, 100%); max-height: 88%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: var(--r3) var(--r3) 0 0; padding: 8px var(--sar) calc(var(--sab) + 24px) var(--sal); box-shadow: 0 -18px 60px rgba(0, 0, 0, .5); animation: up .3s cubic-bezier(.2, .9, .3, 1.05); }
@keyframes up { from { transform: translateY(48px); opacity: .3; } }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--hair); margin: 2px auto 16px; }
.shead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.shead h2 { flex: 1; margin: 0; font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: -.01em; text-wrap: balance; }
.back { width: 36px; height: 36px; margin-left: -8px; display: grid; place-items: center; border-radius: 18px; color: var(--ink2); }
.lead { margin: 0 0 18px; color: var(--ink2); font-size: 14.5px; line-height: 1.5; max-width: 60ch; }
.label { margin: 26px 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }
.label:first-child { margin-top: 4px; }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 8px 0; border-bottom: 1px solid var(--hair); text-align: left; width: 100%; font-size: 15.5px; }
.row:last-child { border-bottom: 0; }
.row .glyph { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #1a1430; background: var(--c, var(--pet)); flex: none; }
.row .glyph svg { width: 19px; height: 19px; }
.row .txt { flex: 1; min-width: 0; }
.row .txt small { display: block; color: var(--ink3); font-size: 13px; margin-top: 2px; line-height: 1.35; }
.row .val { color: var(--ink2); font-variant-numeric: tabular-nums; text-align: right; }
.row .chev { width: 18px; height: 18px; color: var(--ink3); flex: none; }
.row .check { width: 22px; height: 22px; color: var(--pet); flex: none; opacity: 0; }
.row.sel .check { opacity: 1; }
.row.sel { font-weight: 700; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: rgba(255, 255, 255, .14); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.sw.on { background: var(--pet); }
.sw.on::after { transform: translateX(20px); }
.primary { width: 100%; height: 56px; border-radius: 28px; background: var(--pet); color: #1a1430; font-family: var(--display); font-weight: 900; font-size: 18px; margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.primary:active { transform: scale(.98); }
.primary svg { width: 20px; height: 20px; }
.primary[disabled] { opacity: .45; }
.quiet { width: 100%; height: 48px; border-radius: 24px; font-weight: 700; color: var(--ink2); margin-top: 8px; }
.danger { color: var(--bad); }
.field { width: 100%; height: 56px; border: 0; border-bottom: 2px solid var(--hair); background: transparent; color: var(--ink); font: 800 28px var(--display); padding: 0 2px; border-radius: 0; }
.field:focus { outline: none; border-color: var(--pet); }
textarea.code { width: 100%; height: 84px; background: transparent; color: var(--ink2); border: 0; border-bottom: 1px solid var(--hair); font: 12px ui-monospace, Menlo, monospace; resize: none; padding: 8px 0; }
.stat2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 18px; margin: 8px 0 6px; }
.stat2 div { min-width: 0; }
.stat2 b { display: block; font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.stat2 span { font-size: 12.5px; color: var(--ink3); }
.chain2 { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; font-weight: 700; }
.chain2 i { color: var(--ink3); font-style: normal; }

/* Elegir comida: dos opciones grandes, sin tarjetas */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 6px; }
.big { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; text-align: center; }
.big .orb { width: 84px; height: 84px; border-radius: 42px; display: grid; place-items: center; background: var(--c); color: #1a1430; transition: transform .12s; }
.big .orb svg { width: 40px; height: 40px; }
.big:active .orb { transform: scale(.92); }
.big strong { font-family: var(--display); font-size: 19px; }
.big span { font-size: 13px; color: var(--ink3); }

/* Enciclopedia */
.famtabs, .tabs { display: flex; gap: 22px; margin: 2px 0 14px; border-bottom: 1px solid var(--hair); }
.famtabs button, .tabs button { padding: 10px 0; font-weight: 700; font-size: 14.5px; color: var(--ink3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.famtabs button.on, .tabs button.on { color: var(--ink); border-color: var(--pet); }
.dex { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 8px; }
.dex div { text-align: center; font-size: 12.5px; font-weight: 700; min-width: 0; }
.dex canvas { width: 56px; height: 56px; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
.dex small { display: block; font-weight: 500; color: var(--ink3); font-size: 11px; margin-top: 1px; }
.dex .no { color: var(--ink3); }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--hair); font-size: 14.5px; }
.log li:last-child { border-bottom: 0; }
.log time { color: var(--ink3); font-variant-numeric: tabular-nums; width: 82px; flex: none; font-size: 13px; }

/* Armario: la criatura arriba, carrusel abajo */
.wardrobe .sheet { max-height: 46%; }
.carousel { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.item { flex: none; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; scroll-snap-align: start; font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.item .orb { width: 66px; height: 66px; border-radius: 33px; display: grid; place-items: center; background: rgba(255, 255, 255, .07); color: var(--ink); position: relative; transition: transform .12s; }
.item .orb svg { width: 32px; height: 32px; }
.item.sel .orb { box-shadow: 0 0 0 3px var(--pet); background: color-mix(in srgb, var(--pet) 22%, transparent); }
.item.sel { color: var(--ink); }
.item .price { display: flex; align-items: center; gap: 3px; color: var(--star); font-variant-numeric: tabular-nums; }
.item .price svg { width: 12px; height: 12px; fill: var(--star); }
.item .lock { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 11px; background: var(--surface); display: grid; place-items: center; }
.item .lock svg { width: 13px; height: 13px; fill: var(--star); }

/* Selector de huevo: pantalla completa sobre la escena 3D */
#pick { position: fixed; inset: 0; z-index: 18; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
#pick > * { pointer-events: auto; }
.ptop { padding: calc(var(--sat) + 18px) var(--sar) 30px var(--sal); background: linear-gradient(rgba(10, 8, 26, .7), rgba(10, 8, 26, 0)); }
.steps { display: flex; gap: 6px; margin-bottom: 14px; }
.steps i { height: 4px; flex: 1; border-radius: 2px; background: rgba(255, 255, 255, .18); }
.steps i.on { background: var(--ink); }
.ptop h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 32px; letter-spacing: -.01em; text-wrap: balance; }
.ptop p { margin: 8px 0 0; color: var(--ink2); font-size: 15px; line-height: 1.45; max-width: 40ch; }
.pmid { display: flex; justify-content: space-between; align-items: center; padding: 0 var(--sar) 0 var(--sal); flex: 1; pointer-events: none; }
.pmid button { pointer-events: auto; }
.arrow { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.pbot { padding: 30px var(--sar) calc(var(--sab) + 18px) var(--sal); background: linear-gradient(rgba(10, 8, 26, 0), rgba(10, 8, 26, .82) 40%); }
.pbot h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 24px; }
.pbot .desc { margin: 4px 0 0; color: var(--ink2); font-size: 14.5px; line-height: 1.45; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0 2px; }
.swatches button { width: 40px; height: 40px; border-radius: 20px; background: var(--c); box-shadow: inset 0 -4px 8px rgba(0, 0, 0, .25); transition: transform .15s; }
.swatches button.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); transform: scale(1.06); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.chips button { height: 38px; padding: 0 15px; border-radius: 19px; background: rgba(255, 255, 255, .09); font-weight: 700; font-size: 14px; color: var(--ink2); }
.chips button.on { background: var(--ink); color: #1a1430; }
.hint2 { margin: 8px 0 0; font-size: 13px; color: var(--ink3); min-height: 2.6em; line-height: 1.4; }

#toast { position: fixed; left: 50%; top: calc(var(--sat) + 132px); transform: translate(-50%, -10px); z-index: 40; background: rgba(247, 244, 255, .96); color: #1a1430; padding: 11px 18px; border-radius: 22px; font-size: 14.5px; font-weight: 700; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: min(88vw, 420px); text-align: center; line-height: 1.35; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Juego */
#game { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 40px var(--sar) calc(var(--sab) + 16px) var(--sal); background: linear-gradient(rgba(10, 8, 26, 0), rgba(10, 8, 26, .7) 35%); text-align: center; }
#game h2 { font-family: var(--display); font-weight: 900; font-size: 24px; margin: 0; }
.gdots { display: flex; justify-content: center; gap: 8px; margin: 10px 0 16px; }
.gdots i { width: 12px; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .2); }
.gdots i.w { background: var(--care); } .gdots i.l { background: var(--bad); }
.gbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 520px; margin: 0 auto; }
